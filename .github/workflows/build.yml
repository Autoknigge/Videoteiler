name: APK bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP entpacken
        run: unzip -q "$(find . -name 'VideoTeiler*.zip' | head -n 1)"
      - name: Versionsnummer bestimmen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release view aktuell --json body -q .body 2>/dev/null | grep -o 'Version [0-9]*\.[0-9]*' | head -n 1 | cut -d' ' -f2 || true)
          if [ -z "$prev" ]; then v="1.0"
          else
            major="${prev%%.*}"; minor="${prev#*.}"
            if [ "$minor" -ge 9 ]; then v="$(( major + 1 )).0"; else v="${major}.$(( minor + 1 ))"; fi
          fi
          echo "Version: $v"
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Festen Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/status-sicherer.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/status-sicherer.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Schlüssel hinterlegt - APK wird mit Testschlüssel signiert."
          fi
      - name: APK bauen
        working-directory: VideoTeiler
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleGratisRelease assembleStartRelease assembleProRelease bundleGratisRelease bundleStartRelease bundleProRelease bundlePlayRelease --no-daemon --stacktrace
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp VideoTeiler/app/build/outputs/apk/gratis/release/app-gratis-release.apk Video-Teiler.apk
          cp VideoTeiler/app/build/outputs/apk/start/release/app-start-release.apk Video-Teiler-Start.apk
          cp VideoTeiler/app/build/outputs/apk/pro/release/app-pro-release.apk Video-Teiler-Pro.apk
          cp VideoTeiler/app/build/outputs/bundle/gratisRelease/app-gratis-release.aab Video-Teiler.aab
          cp VideoTeiler/app/build/outputs/bundle/startRelease/app-start-release.aab Video-Teiler-Start.aab
          cp VideoTeiler/app/build/outputs/bundle/proRelease/app-pro-release.aab Video-Teiler-Pro.aab
          cp VideoTeiler/app/build/outputs/bundle/playRelease/app-play-release.aab Video-Teiler-Play.aab
          gh release delete aktuell --yes --cleanup-tag || true
          gh release create aktuell Video-Teiler.apk Video-Teiler-Start.apk Video-Teiler-Pro.apk Video-Teiler.aab Video-Teiler-Start.aab Video-Teiler-Pro.aab Video-Teiler-Play.aab --title "Video-Teiler $VERSION_NAME" --notes "Version $VERSION_NAME (Gratis mit Werbebanner, Start mit Startwerbung, Pro ohne Werbung)" --target "${{ github.sha }}"
